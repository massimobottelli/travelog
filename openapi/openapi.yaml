openapi: 3.1.0

info:
  title: Travelog API
  version: 0.1.0
  description: |
    REST API for Travelog MVP1.

    Functional behavior is defined by:
    `doc/functional-requirements-mvp1.md`

    Technical architecture is defined by:
    `doc/technical-design-mvp1.md`

servers:
  - url: /api
    description: Travelog API

tags:
  - name: Health
  - name: Config
  - name: Scans
  - name: Photos
  - name: Trips
  - name: Trip Operations
  - name: Localities
  - name: Exclusion Zones
  - name: Settings
  - name: Data

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API health
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /scans:
    post:
      tags: [Scans]
      operationId: startScan
      summary: Start a photo scan
      description: |
        Starts an asynchronous scan of the selected directory.
        The directory must be relative to the configured photo root.

        Only one scan may run at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartScanRequest"
      responses:
        "202":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: Invalid scan request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Another scan is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    get:
      tags: [Scans]
      operationId: listScans
      summary: List scan history
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Scan history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanList"

  /scans/{scanId}:
    get:
      tags: [Scans]
      operationId: getScan
      summary: Get scan status and progress
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: Scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /scans/{scanId}/errors:
    get:
      tags: [Scans]
      operationId: listScanErrors
      summary: List errors recorded for a scan
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: Scan errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanErrorList"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /scans/{scanId}/cancel:
    post:
      tags: [Scans]
      operationId: cancelScan
      summary: Request cancellation of a running scan
      description: |
        Asks the running scan to stop after the photo currently being
        processed. The scan is then marked as failed with a diagnostic
        message ("Scan cancelled by the user"); photos already saved
        remain in the database.

        The response returns immediately with the current scan snapshot.
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Scan is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /photos:
    get:
      tags: [Photos]
      operationId: listPhotos
      summary: List catalogued photos
      description: |
        Technical data listing of catalogued photos.

        Photos are not displayed as images in MVP1; this view exposes
        the persisted metadata only: original shoot timestamp, original
        GPS coordinates and the hierarchical administrative locality
        resolved by reverse geocoding when available.
      parameters:
        - name: metadataStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PhotoMetadataStatus"
          description: Filter by metadata status.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Photo list ordered by shoot date descending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoList"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: Get runtime configuration
      responses:
        "200":
          description: Runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"

    put:
      tags: [Config]
      operationId: updateConfig
      summary: Update the photo root path
      description: |
        Persists TRAVELOG_PHOTO_ROOT in the root .env file and applies
        the change immediately. An empty value clears the configuration.

        The path must be absolute and must exist as a directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigRequest"
      responses:
        "200":
          description: Updated runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"
        "400":
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /data:
    delete:
      tags: [Data]
      operationId: deleteAllData
      summary: Delete all catalogued data
      description: |
        Irreversibly deletes every photo, scan, scan error, locality,
        geocoding cache entry, presence, trip, trip history record and
        application setting.

        The photo root configuration (.env) is not modified.

        The operation is rejected while a scan is running.
      responses:
        "204":
          description: All data deleted
        "409":
          description: Another scan is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips:
    get:
      tags: [Trips]
      operationId: listTrips
      summary: List trips
      description: |
        By default only active trips are returned.
        Archived/superseded trips can be requested explicitly.

        Results are ordered by start date descending by default.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TripListStatus"
          description: Filter by trip status.
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: |
            Free-text search by trip name or year/month.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - startDateDesc
              - startDateAsc
          default: startDateDesc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Trip list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripList"

    post:
      tags: [Trips]
      operationId: createTrip
      summary: Create a trip manually
      description: |
        Creates a trip from an explicit manual operation.

        This endpoint is not used by automatic scan processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "201":
          description: Trip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          description: Invalid trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Trip overlaps another active trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips/{tripId}:
    get:
      tags: [Trips]
      operationId: getTrip
      summary: Get trip details
      description: |
        Returns the trip data plus the chronology of its days: visited
        localities with administrative hierarchy and photo counts per
        day/locality; days without photos (gaps of 1–2 days) are listed
        with the "Nessuna foto" marker (functional requirements §16).
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Trip details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    patch:
      tags: [Trips]
      operationId: updateTrip
      summary: Modify a trip manually
      description: |
        Allows the manual modifications supported by MVP1:
        rename and/or change start/end dates.

        Automatic processing never modifies an existing trip.

        Active trips must not overlap temporally.
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripRequest"
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          description: Invalid modification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Modification would overlap another active trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      tags: [Trips]
      operationId: deleteTrip
      summary: Delete a trip
      description: |
        Explicit user operation: removes a trip whose period is not a
        trip. The deletion is recorded in the operations audit trail
        with a snapshot of the deleted trip (functional requirements
        §14). Photographs and presences are not deleted.
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "204":
          description: Trip deleted
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips/{tripId}/split:
    post:
      tags: [Trips]
      operationId: splitTrip
      summary: Split a trip
      description: |
        Splits a trip at the specified date.

        The split date belongs to the second resulting trip.
        The original trip remains in history.
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitTripRequest"
      responses:
        "200":
          description: Split result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripOperationResult"
        "400":
          description: Invalid split date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Split would violate trip constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips/merge:
    post:
      tags: [Trips]
      operationId: mergeTrips
      summary: Merge two or more trips
      description: |
        Merges two or more trips into a new trip.

        Original trips are retained in history and marked as superseded.
        The resulting trip keeps a relationship to the source trips.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeTripsRequest"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripOperationResult"
        "400":
          description: Invalid merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: One or more trips were not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Trips cannot be merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /operations:
    get:
      tags: [Trip Operations]
      operationId: listTripOperations
      summary: List trip operations (audit trail)
      description: |
        Chronological history of the manual trip operations (split, merge).
        Each entry records the source trips, the resulting trips and the
        timestamp of the operation (functional requirements §14).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Operation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripOperationList"

  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get current settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

    put:
      tags: [Settings]
      operationId: updateSettings
      summary: Update settings
      description: |
        Updates one or more setting values.

        Only provided fields are updated; omitted fields remain unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Invalid settings update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      tags: [Settings]
      operationId: recalculate
      summary: Trigger trip recalculation
      description: |
        Requests an explicit trip recalculation.

        The operation returns immediately with ACCEPTED status.
        Actual recalculation proceeds asynchronously.
      responses:
        "202":
          description: Recalculation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recalculation"
        "400":
          description: Invalid recalculation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /exclusion-zones:
    get:
      tags: [Exclusion Zones]
      operationId: listExclusionZones
      summary: List exclusion zones
      responses:
        "200":
          description: Exclusion zone list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExclusionZone"

    post:
      tags: [Exclusion Zones]
      operationId: createExclusionZone
      summary: Create an exclusion zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExclusionZoneRequest"
      responses:
        "201":
          description: Exclusion zone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExclusionZone"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Administrative area not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      tags: [Exclusion Zones]
      operationId: deleteExclusionZone
      summary: Delete an exclusion zone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: Deleted
        "404":
          description: Exclusion zone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /localities/search:
    get:
      tags: [Localities]
      operationId: searchLocalities
      summary: Search localities by name, region or county
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Search query (matches name, region, county)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum results to return
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Locality"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"


components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based)
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size
    ScanId:
      name: scanId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          example: TRIP_NOT_FOUND
        message:
          type: string
          example: Trip not found
        details:
          type: object
          additionalProperties: true

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp, uptime_seconds, version, environment]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
        uptime_seconds:
          type: number
        version:
          type: string
          example: "0.1.0"
        environment:
          type: string
          example: development

    StartScanRequest:
      type: object
      additionalProperties: false
      required: [folder]
      properties:
        folder:
          type: string
          maxLength: 1024
          description: |
            Directory to scan, relative to the configured photo root.
            An empty string scans the whole photo root.

    RuntimeConfig:
      type: object
      additionalProperties: false
      required: [photoRoot]
      properties:
        photoRoot:
          type: string
          nullable: true
          description: |
            Root directory of the photo archive (TRAVELOG_PHOTO_ROOT).
            Null when not yet configured.

    UpdateConfigRequest:
      type: object
      additionalProperties: false
      required: [photoRoot]
      properties:
        photoRoot:
          type: [string, "null"]
          description: |
            New photo root path. Must be absolute and exist as a directory.
            An empty string or null clears the configuration.

    ScanStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - completed_with_errors
        - failed
        - stopped

    Scan:
      type: object
      additionalProperties: false
      required:
        - id
        - folder
        - status
        - startedAt
        - filesAnalyzed
        - newPhotos
        - existingPhotos
        - excludedPhotos
        - errors
      properties:
        id:
          type: integer
          format: int64
        folder:
          type: string
        status:
          $ref: "#/components/schemas/ScanStatus"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        filesAnalyzed:
          type: integer
          nullable: true
        filesTotal:
          type: integer
          nullable: true
          description: |
            Total supported files found by enumeration (including
            subfolders). Known once enumeration completes; enables the
            proportional progress bar.
        newPhotos:
          type: integer
          nullable: true
        existingPhotos:
          type: integer
          nullable: true
        excludedPhotos:
          type: integer
          nullable: true
        errors:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true

    ScanList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Scan"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ScanError:
      type: object
      additionalProperties: false
      required: [id, scanId, filePath, errorCode, message, createdAt]
      properties:
        id:
          type: integer
          format: int64
        scanId:
          type: integer
          format: int64
        filePath:
          type: string
        errorCode:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time

    ScanErrorList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScanError"

    PhotoMetadataStatus:
      type: string
      enum: [valid, excluded]

    PhotoLocality:
      type: object
      additionalProperties: false
      required: [countryCode, name]
      properties:
        countryCode:
          type: string
        name:
          type: string
          description: Most specific administrative unit resolved by the geocoder
        county:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        country:
          type: string
          nullable: true

    Photo:
      type: object
      additionalProperties: false
      required:
        - id
        - filePath
        - fileName
        - fileType
        - dateTimeOriginal
        - originalLatitude
        - originalLongitude
        - metadataStatus
      properties:
        id:
          type: integer
          format: int64
        filePath:
          type: string
        fileName:
          type: string
        fileType:
          type: string
        dateTimeOriginal:
          type: string
          format: date-time
          nullable: true
          description: EXIF DateTimeOriginal as naive local time; null when unreadable/missing (excluded photos)
        originalLatitude:
          type: number
          nullable: true
        originalLongitude:
          type: number
          nullable: true
        metadataStatus:
          $ref: "#/components/schemas/PhotoMetadataStatus"
        exclusionReason:
          type: string
          nullable: true
        locality:
          description: Hierarchical administrative locality when reverse geocoding succeeded
          oneOf:
            - $ref: "#/components/schemas/PhotoLocality"
          nullable: true

    PhotoList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Trip:
      type: object
      additionalProperties: false
      required: [id, name, startDate, endDate, autoGenerated, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        autoGenerated:
          type: boolean
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time

    CreateTripRequest:
      type: object
      additionalProperties: false
      required: [startDate, endDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    UpdateTripRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    SplitTripRequest:
      type: object
      additionalProperties: false
      required: [splitDate]
      properties:
        splitDate:
          type: string
          format: date
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Optional name for the second trip. When omitted, the system
            proposes one; the user can change it before confirming.

    MergeTripsRequest:
      type: object
      additionalProperties: false
      required: [tripIds]
      properties:
        tripIds:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
        title:
          type: [string, null]
          minLength: 1

    TripOperationType:
      type: string
      enum: [SPLIT, MERGE, DELETE]

    TripOperation:
      type: object
      additionalProperties: false
      required: [id, type, createdAt, sourceTripIds, resultingTripIds]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TripOperationType"
        createdAt:
          type: string
          format: date-time
        sourceTripIds:
          type: array
          items:
            type: integer
            format: int64
        resultingTripIds:
          type: array
          items:
            type: integer
            format: int64

    TripOperationResult:
      type: object
      additionalProperties: false
      required: [operation, trips]
      properties:
        operation:
          $ref: "#/components/schemas/TripOperation"
        trips:
          type: array
          items:
            $ref: "#/components/schemas/Trip"

    TripOperationList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TripOperation"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    TripDayLocality:
      type: object
      additionalProperties: false
      required: [localityId, name, photoCount]
      properties:
        localityId:
          type: integer
        name:
          type: string
        county:
          type: [string, null]
        region:
          type: [string, null]
        country:
          type: [string, null]
        photoCount:
          type: integer

    TripDay:
      type: object
      additionalProperties: false
      required: [date, noPhotos, localities]
      properties:
        date:
          type: string
          format: date
        noPhotos:
          type: boolean
          description: |
            True for days without photos inside the trip (gaps of 1–2 days
            are listed with the "Nessuna foto" marker, §16).
        localities:
          type: array
          items:
            $ref: "#/components/schemas/TripDayLocality"

    TripDetail:
      type: object
      additionalProperties: false
      required: [id, name, startDate, endDate, autoGenerated, status, createdAt, days]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        autoGenerated:
          type: boolean
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
        days:
          type: array
          items:
            $ref: "#/components/schemas/TripDay"

    TripList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Trip"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Settings:
      type: object
      additionalProperties: false
      required: [minimumConsecutiveDaysWithPhotos, consecutiveDaysWithoutPhotosBeforeClosing]
      properties:
        minimumConsecutiveDaysWithPhotos:
          type: integer
          minimum: 1
          default: 2
        consecutiveDaysWithoutPhotosBeforeClosing:
          type: integer
          minimum: 0
          default: 3

    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        minimumConsecutiveDaysWithPhotos:
          type: integer
          minimum: 1
        consecutiveDaysWithoutPhotosBeforeClosing:
          type: integer
          minimum: 0

    Recalculation:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ACCEPTED]

    ExclusionZone:
      type: object
      additionalProperties: false
      required: [id, locality, scope]
      properties:
        id:
          type: integer
          format: int64
        locality:
          $ref: "#/components/schemas/Locality"
        scope:
          type: string
          enum: [locality, county, region]
          description: |
            Hierarchy level the exclusion applies to (§9.1): locality
            (comune), county (provincia) or region (regione).

    CreateExclusionZoneRequest:
      type: object
      additionalProperties: false
      required: [localityId]
      properties:
        localityId:
          type: integer
          format: int64
        scope:
          type: string
          enum: [locality, county, region]
          default: locality
          description: |
            Hierarchy level the exclusion applies to (§9.1): the locality
            itself, its county (provincia) or its region. The anchor
            locality must have the corresponding level.
          minimum: 1

    Locality:
      type: object
      additionalProperties: false
      required: [id, source, countryCode, name, adminLevel, localityHash]
      properties:
        id:
          type: integer
          format: int64
        localityHash:
          type: string
          description: Coordinate hash key, e.g. "45.56:9.17"
        source:
          type: string
          description: Provider name (e.g. "geoapify")
        countryCode:
          type: string
        name:
          type: string
        adminLevel:
          type: integer
          description: Administrative level (0=highest, higher=more specific)
        region:
          type: string
          nullable: true
          description: Region/state, e.g. "Lombardia"
        county:
          type: string
          nullable: true
          description: County/province, e.g. "Monza e Brianza"
        country:
          type: string
          nullable: true
          description: Country name, e.g. "Italy"
        createdAt:
          type: string
          format: date-time

    TripListStatus:
      type: string
      enum: [active, archived]
