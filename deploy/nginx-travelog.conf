# Travelog — Nginx site (MVP1)
#
# Install:  sudo cp deploy/nginx-travelog.conf /etc/nginx/sites-available/travelog
#           sudo ln -sf /etc/nginx/sites-available/travelog /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
#
# Single origin: static React build + reverse proxy /api → Express (:3000).
# No CORS is needed in production (technical design §56).

server {
    listen 80 default_server;
    server_name _;

    root /opt/travelog/frontend/dist;
    index index.html;

    # REST API → Express backend
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static frontend with SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
